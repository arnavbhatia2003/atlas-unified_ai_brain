# Sprint 1 CI — automated build + backend tests + linting on every push.
# DB-integration tests skip automatically when Postgres is unreachable, so the
# suite runs green without provisioning a database.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-slim.txt

      # Slim set (no torch/Docling): enough for FastAPI, LangChain/LangGraph,
      # asyncpg, pydantic — everything the test suite imports.
      - run: pip install -r requirements-slim.txt pytest

      - run: python -m pytest tests -q

  frontend:
    name: Frontend — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build
